name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Prepare openexr-images samples
      shell: pwsh
      run: ./Scripts/prepare-openexr-images.ps1

    - name: Test default target
      run: dotnet test --project ./Test/TinyEXR.Test/TinyEXR.Test.csproj --configuration Release --report-trx --report-trx-filename TinyEXR.Test.trx -p:SignAssemblyKey=false

    - name: Test netstandard fallback target
      run: dotnet test --project ./Test/TinyEXR.NetStandardFallback.Test/TinyEXR.NetStandardFallback.Test.csproj --configuration Release --report-trx --report-trx-filename TinyEXR.NetStandardFallback.Test.trx -p:SignAssemblyKey=false

  package-aot-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install NativeAOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Pack local unsigned package
      run: dotnet pack ./TinyEXR.NET/TinyEXR.NET.csproj --configuration Release -p:SignAssemblyKey=false -p:GeneratePackageOnBuild=false --output ./artifacts/packages

    - name: Restore package consumer from local package
      run: dotnet restore ./Test/TinyEXR.PackageSmoke/TinyEXR.PackageSmoke.csproj --runtime linux-x64 -p:PublishAot=true --configfile ./Test/TinyEXR.PackageSmoke/NuGet.config --packages ./artifacts/consumer-packages

    - name: Publish package consumer with NativeAOT
      run: dotnet publish ./Test/TinyEXR.PackageSmoke/TinyEXR.PackageSmoke.csproj --configuration Release --runtime linux-x64 -p:PublishAot=true --no-restore --output ./artifacts/aot-smoke -p:RestorePackagesPath=${{ github.workspace }}/artifacts/consumer-packages

    - name: Run NativeAOT package consumer
      run: ./artifacts/aot-smoke/TinyEXR.PackageSmoke
